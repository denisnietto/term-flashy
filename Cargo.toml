[package]
name = "term-flashy"
version = "0.1.0"
edition = "2024"
default-run = "term-flashy"

[dependencies]
gio = "0.22"
glib = "0.22"
gtk4 = { version = "0.11", features = ["v4_10"] }
pango = "0.22"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.3"
vte4 = { version = "0.10", features = ["v0_78"] }
