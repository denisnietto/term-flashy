[package]
name = "term-flashy"
version = "0.1.0"
edition = "2024"
default-run = "term-flashy"

[dependencies]
gio = "0.22"
glib = "0.22"
gtk4 = { version = "0.11", features = ["v4_10"] }
nix = { version = "0.31.3", features = ["term", "ioctl", "signal", "socket", "process", "fs", "poll", "user"] }
pango = "0.22"
rand = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.4.5"
toml = "1.1.3"
unicode-width = "0.2.2"
vt100 = "0.16.2"
vte4 = { version = "0.10", features = ["v0_78"] }
